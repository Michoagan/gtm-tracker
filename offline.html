<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors ligne — GTM Tracker</title>
    <link rel="stylesheet" href="/gtm-tracker/css/style.css">
    <style>
        body {
            background-color: #0a0e1a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .offline-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px 24px;
            max-width: 440px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .offline-icon {
            font-size: 50px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn-retry {
            display: inline-block;
            background: #6366f1;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">📡</div>
        <h1>Connexion Internet interrompue</h1>
        <p>GTM Tracker n'arrive pas à joindre le serveur. Vérifiez votre réseau ou réessayez dans quelques instants.</p>
        <button class="btn-retry" onclick="window.location.reload()">Réessayer</button>
    </div>
</body>
</html>
